name: Prototype checks

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Security tests
        run: npm test
      - name: Type check and build
        run: npm run build
